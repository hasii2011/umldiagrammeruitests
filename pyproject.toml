[build-system]
requires = ['setuptools', 'wheel']
build-backend = "setuptools.build_meta"

[project]
name='umldiagrammeruitests'
dynamic = ["version"]
description = 'UI Tests for UML Diagrammer'
readme = "README.md"
license = 'AGPL-1.0-or-later'
authors = [{name = 'Humberto A. Sanchez II', email = 'Humberto.A.Sanchez.II@gmail.com'}]
maintainers = [{name = 'Humberto A. Sanchez II', email = 'Humberto.A.Sanchez.II@gmail.com'}]
keywords = ['graph, layout, python, uml, test']

dependencies = [
    'click>=8.0.0',
    'pyautogui>=0.9.54',
    'pillow>=12.3.0',
    'opencv-python>=5.0.0.93',
    'codeallybasic>=1.4.0',
]

[project.optional-dependencies]
test = [
    'mypy==2.3.0',
    'mypy-extensions==1.1.0',
    'types-Deprecated==1.3.1.20260520',
    'html-testRunner~=1.2.1',
    'pyautogui==0.9.54',
    'pillow==12.3.0',
]

deploy = [
    "wheel==0.47.0",
    "setuptools==83.0.0",
    "twine==6.2.0",
    "build==1.5.0",
]

[project.urls]
Repository = 'https://github.com/hasii2011/umldiagrammeruitests'


[tool.setuptools.packages.find]
where = ['src']

[tool.setuptools.package-data]
'umldiagrammeruitests.resources' = ['loggingConfiguration.json']

[tool.setuptools.dynamic]
version = {attr = 'umldiagrammeruitests.__version__'}

[project.scripts]
# Exposes the 'uitest' group from Commands.py as a CLI
uitest = 'umldiagrammeruitests.Commands:uitest'

